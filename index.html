<style>

</head><body><div id="app" dir="rtl" lang="ar"></div>

<script>
"use strict";
/* ============================================================================
   إملائي — نظام تعلّم العربية (إملاء بخط اليد)
   Architecture: 4 layers exactly as in the architecture diagram.
     1) Presentation  : UI only. Talks to the Application layer, never to Processing/Data directly.
     2) Application   : AppController — validate inputs, manage requests, coordinate processing.
     3) Processing&AI : AudioPlayer (TTS), OCRProcessor, ComparisonEngine, Feedback generation.
     4) Data          : SentenceRepository, ResultRepository, UserRepository (Sentences / Results).
   Entity classes (User, Sentence, DictationSubmission, EvaluationResult, CorrectionDetail,
   Feedback) follow the class diagram's attributes and methods.
   ========================================================================== */

/* ---------- shared: trace (shows the layer flow in the architecture tab) ---------- */
const Trace = {
  items: [], listeners: [],
  log(layer, msg){ this.items.unshift({layer, msg, t: new Date()}); this.items.length = Math.min(this.items.length, 60); this.listeners.forEach(f => f(layer)); }
};
const LAYERS = {
  Presentation: {ar:"طبقة العرض", c:"var(--l1)"},
  Application:  {ar:"طبقة التطبيق", c:"var(--l2)"},
  Processing:   {ar:"المعالجة والذكاء الاصطناعي", c:"var(--l3)"},
  Data:         {ar:"طبقة البيانات", c:"var(--l4)"}
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9);

/* ============================ ENTITIES (class diagram) ============================ */
class User {
  constructor({userID, name, email, role = "learner"}){ this.userID = userID; this.name = name; this.email = email; this.role = role; }
  /* User methods map to Application.AppController: login(), logout(), selectSentence(), enterSentence(), uploadHandwriting(), viewFeedback() */
}
class Sentence {
  constructor({sentenceId, textContent, spokenText, audioUrl, custom = false, generated = false, level}){ this.sentenceId = sentenceId; this.textContent = textContent; this.spokenText = spokenText || textContent; /* spokenText = fully vowelled version used only for speech */ this.audioUrl = audioUrl || ("tts:ar-SA/" + sentenceId); this.custom = custom; this.generated = generated; this.level = level || Sentence.levelFor(textContent); }
  getSentenceDetails(){
    const words = this.textContent.trim().split(/\s+/).length;
    return `${this.sentenceId} · ${words} كلمات · ${words <= 4 ? "سهلة" : words <= 6 ? "متوسطة" : "أصعب"}`;
  }
  get wordCount(){ return this.textContent.trim().split(/\s+/).length; }
  /* level by word count: 1 easy (3 words), 2 medium (4-5), 3 advanced (6 or more) */
  static levelFor(t){ const n = t.trim().split(/\s+/).length; return n <= 3 ? 1 : n <= 5 ? 2 : 3; }
}
class DictationSubmission {
  constructor(){ this.submissionId = uid("sub_"); this.imagePath = ""; this.imageFormat = ""; this.uploadTimestamp = null; this.blob = null; this._file = null; }
  static ALLOWED = ["image/jpeg","image/png","image/heic","image/heif","image/webp"];
  static MAX_BYTES = 15 * 1024 * 1024;
  /* use case: Upload Handwriting -> «include» Validate Image */
  validateFormat(){
    const f = this._file; if (!f) return false;
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    const type = (f.type || "").toLowerCase() || ({jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",heic:"image/heic",heif:"image/heif",webp:"image/webp"})[ext] || "";
    this.imageFormat = type.replace("image/", "").toUpperCase();
    return DictationSubmission.ALLOWED.includes(type) && f.size > 0 && f.size <= DictationSubmission.MAX_BYTES;
  }
  /* capture and upload share one pipeline: a camera shot is just a file from the device */
  captureImage(file){ return this.uploadImage(file); }
  async uploadImage(imageFile){
    this._file = imageFile;
    if (!this.validateFormat()) throw new AppError("format", "صيغة الصورة غير مدعومة أو حجمها كبير. استخدم JPEG أو PNG أو HEIC بحجم أقل من 15 ميغابايت.");
    let bmp;
    try { bmp = await createImageBitmap(imageFile); }
    catch (e) {
      if (!/HEI[CF]/.test(this.imageFormat)) throw new AppError("decode", "تعذّر فتح الصورة. جرّب صورة أخرى أو التقطها من جديد.");
      try { bmp = await createImageBitmap(await Processing.heicToJpeg(imageFile)); }
      catch (e2) { throw new AppError("heic", "تعذّر تحويل صورة HEIC على هذا المتصفح. التقط الصورة بصيغة JPEG أو جرّب متصفحاً آخر."); }
    }
    if (bmp.width < 200 || bmp.height < 60) throw new AppError("small", "الصورة صغيرة جداً. قرّب الكاميرا من الورقة وأعد التصوير.");
    const MAX = 1280, k = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); try { g.filter = "grayscale(1) contrast(1.35) brightness(1.05)"; } catch {} g.drawImage(bmp, 0, 0, c.width, c.height);
    this.blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
    if (!this.blob) throw new AppError("decode", "تعذّر تجهيز الصورة.");
    if (this.imagePath) URL.revokeObjectURL(this.imagePath);
    this.imagePath = URL.createObjectURL(this.blob);   /* kept in memory only, never stored (privacy) */
    this.uploadTimestamp = new Date();
    return true;
  }
  dispose(){ if (this.imagePath) URL.revokeObjectURL(this.imagePath); this.blob = null; this._file = null; this.imagePath = ""; }
}
class CorrectionDetail {
  constructor({incorrectWord, correctWord, errorPositionIndex, kind, hint}){ this.detailId = uid("cd_"); this.incorrectWord = incorrectWord; this.correctWord = correctWord; this.errorPositionIndex = errorPositionIndex; this.kind = kind; this.hint = hint; }
  getCorrectionSummary(){
    return this.kind === "miss" ? `كلمة ناقصة: «${this.correctWord}»` : this.kind === "extra" ? `كلمة زائدة: «${this.incorrectWord}»` : `«${this.incorrectWord}» ← «${this.correctWord}»`;
  }
}
class Feedback {
  constructor(){ this.feedbackText = ""; this.highlightedText = ""; }
  generateFeedback(score, details){
    const cats = {};
    details.forEach(d => { if (d.hint) cats[d.hint] = (cats[d.hint] || 0) + 1; });
    const top = Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k, n]) => `${k} (${n})`);
    let t = score === 100 ? "ممتاز! كتبت الجملة كلها بلا أي خطأ."
      : score >= 80 ? "عمل جيد. أخطاء قليلة فقط، راجعها وأعد المحاولة."
      : score >= 50 ? "بداية جيدة. بعض الكلمات تحتاج إلى مراجعة، استمع إلى الجملة مرة أخرى وانتبه لكل حرف."
      : "الجملة تحتاج إلى مزيد من التدريب. استمع ببطء، واكتب كلمة كلمة.";
    if (top.length) t += " أكثر ما يحتاج انتباهك: " + top.join("، ") + ".";
    this.feedbackText = t; return t;
  }
  highlightSpellingMistakes(ops){
    this.highlightedText = ops.filter(o => o.type !== "miss" || true).map(o =>
      o.type === "ok" ? `<span class="okw">${esc(o.r)}</span>`
      : o.type === "miss" ? `<mark class="miss" title="كلمة ناقصة: ${esc(o.o)}">⟨ناقصة⟩</mark>`
      : `<mark class="err" title="${o.type === "sub" ? "الصحيح: " + esc(o.o) : "كلمة زائدة"}">${esc(o.r)}</mark>`).join(" ");
    return this.highlightedText;
  }
  displayFeedback(){ return {text: this.feedbackText, html: this.highlightedText}; }
}
class EvaluationResult {
  constructor(){ this.resultId = uid("res_"); this.recognizedText = ""; this.correctedText = ""; this.accuracyScore = 0; this.details = []; this.feedback = new Feedback(); this.meta = {}; }
  generateResult({original, recognized, ops, score, details}){
    this.recognizedText = recognized; this.correctedText = original; this.accuracyScore = score; this.details = details;
    this.feedback.generateFeedback(score, details); this.feedback.highlightSpellingMistakes(ops);
  }
  displayResult(){ return {score: this.accuracyScore, recognized: this.recognizedText, corrected: this.correctedText, details: this.details, ...this.feedback.displayFeedback(), meta: this.meta}; }
}
class AppError extends Error { constructor(code, message){ super(message); this.code = code; } }

/* ============================ 4) DATA LAYER ============================ */

  const UserRepository = {
    async hash(pw, salt){
      try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pw)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }

/* ============================ 3) PROCESSING & AI LAYER ============================ */
const Processing = (() => {
  /* ---- Arabic text-to-speech ---- */
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  /* ---- Arabic text-to-speech: best available Standard Arabic voice, calm pace, optional word-by-word dictation ---- */
  class AudioPlayer {
    constructor(){ this.currentAudioUrl = ""; this.volume = 1; this.pace = "normal"; this.voiceName = ""; this._last = null; this._tok = 0; this.clips = null; this.ctx = null; this.gain = null; this._srcs = []; this._loading = null; }
    static PACE = {normal: 0.9, slow: 0.7, dictation: 0.8};
    static supported(){ return "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function"; }
    /* prefer neural/natural voices, then Google, and Saudi (Standard Arabic) over regional dialect voices */
    static score(v){
      let n = 0;
      if (/natural|neural|online|enhanced|premium/i.test(v.name)) n += 40;
      if (/google/i.test(v.name)) n += 15;
      if (/hamed|حامد/i.test(v.name)) n += 100;   /* the same voice as the recorded sentences (Edge: Microsoft Hamed Online) */
      if (/^ar[-_]SA$/i.test(v.lang)) n += 30; else if (/^ar[-_](AE|QA|KW|BH|OM|JO|IQ)$/i.test(v.lang)) n += 12; else if (/^ar[-_](EG|LB|SY|DZ|MA|TN|LY|SD|YE)$/i.test(v.lang)) n += 2; else n += 8;
      if (!v.localService) n += 5;
      return n;
    }
    async voices(){
      if (!AudioPlayer.supported()) return [];
      const get = () => speechSynthesis.getVoices().filter(v => /^ar/i.test(v.lang));
      let l = get();
      if (!l.length){ await new Promise(r => { const t = setTimeout(r, 1200); speechSynthesis.addEventListener("voiceschanged", () => { clearTimeout(t); r(); }, {once: true}); }); l = get(); }
      return l.map(v => ({name: v.name, lang: v.lang, score: AudioPlayer.score(v)})).sort((a, b) => b.score - a.score);
    }
    async _voice(){
      const l = await this.voices(); const pick = (this.voiceName && l.find(x => x.name === this.voiceName)) || l[0];
      return pick ? speechSynthesis.getVoices().find(v => v.name === pick.name) || null : null;
    }
    _say(text, rate, voice, tok, watch){
      return new Promise((resolve, reject) => {
        if (tok !== this._tok) return resolve();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = voice ? voice.lang : "ar-SA"; if (voice) u.voice = voice; u.rate = rate; u.volume = this.volume; u.pitch = 1;
        let started = false;
        const wd = watch ? setTimeout(() => { if (!started){ speechSynthesis.cancel(); reject(new AppError("tts", "لم يبدأ الصوت.")); } }, 4000) : 0;
        u.onstart = () => { started = true; clearTimeout(wd); };
        u.onend = () => { clearTimeout(wd); resolve(); };
        u.onerror = e => { clearTimeout(wd); e.error === "interrupted" || e.error === "canceled" ? resolve() : reject(new AppError("tts", "تعذّر تشغيل الصوت.")); };
        speechSynthesis.speak(u);
      });
    }
    /* ---- recorded voice: one file per sentence (audio/NNN_f.mp3 = whole sentence, NNN_s.mp3 = words for dictation), same sound on every device ---- */
    loadClips(){
      if (this._loading) return this._loading;
      this._loading = (async () => {
        try {
          const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
          const r = await fetch("manifest.json"); if (!r.ok) return null;
          const j = await r.json(), ctx = new AC();
          this.man = j; this._bufs = new Map(); this._packs = new Map();
          this.ctx = ctx; this.gain = ctx.createGain(); this.gain.gain.value = this.volume; this.gain.connect(ctx.destination); this.clips = true; return true;
        } catch { return null; }
      })();
      return this._loading;
    }
    canPlayRecorded(sentence){ return !!(this.clips && !this.voiceName && sentence && /^audio\/\d{3}$/.test(sentence.audioUrl || "")); }
    async _pack(n){
      if (!this._packs.has(n)) this._packs.set(n, fetch("pk/" + String(n).padStart(2, "0") + ".bin").then(r => { if (!r.ok) throw new Error("pack " + r.status); return r.arrayBuffer(); }).catch(e => { this._packs.delete(n); throw e; }));
      return this._packs.get(n);
    }
    async _buf(idx, kind){
      const key = idx + kind;
      if (!this._bufs.has(key)) this._bufs.set(key, (async () => {
        const e = this.man.i[idx][kind], pk = await this._pack(Math.floor(idx / this.man.p));
        return this.ctx.decodeAudioData(pk.slice(e[0], e[0] + e[1]));
      })().catch(e => { this._bufs.delete(key); throw e; }));
      return this._bufs.get(key);

    _seg(buf, off, dur, rate, t){ const src = this.ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate; src.connect(this.gain); if (dur) src.start(t, off, dur); else src.start(t); this._srcs.push(src); return t + (dur || buf.duration) / rate; }

      const ctx = this.ctx, idx = String(Number(sentence.audioUrl.slice(-3)));
      try { await ctx.resume(); } catch {}
      let f, s = null;
      try { [f, s] = await Promise.all([this._buf(idx, "f"), this.pace === "dictation" ? this._buf(idx, "s") : null]); }
      catch { throw new AppError("tts", "تعذّر تحميل الصوت المسجّل. تحقّق من الاتصال وأعد المحاولة."); }
      if (this._tok !== tok) return;

        if (cuts){ for (const [a, b] of cuts){ const dur = Math.min(b, s.duration) - a; if (dur > 0.05) t = this._seg(s, a, dur, 0.95, t) + 0.9; } }
        else t = this._seg(s, 0, 0, 0.95, t) + 0.4;

    async playAudio(sentence, pace){
      if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();   /* must start inside the tap */

      const text = sentence.spokenText || sentence.textContent;
      if (this.canPlayRecorded(sentence)){
        Trace.log("Processing", "AudioPlayer.playAudio(recorded, " + this.pace + ")");
        const tok = ++this._tok; this._stopSources(); try { speechSynthesis.cancel(); } catch {}
        return this._playRecorded(sentence, tok);
      }
      if (!AudioPlayer.supported()) throw new AppError("tts", "المتصفح لا يدعم النطق الصوتي.");
      Trace.log("Processing", "AudioPlayer.playAudio(" + this.pace + ")");
      const tok = ++this._tok; this._stopSources(); const voice = await this._voice();
      speechSynthesis.cancel(); await sleep(80); if (tok !== this._tok) return;
      if (this.pace === "dictation"){
        const ws = text.split(/\s+/).filter(Boolean);
        for (let i = 0; i < ws.length; i++){ if (tok !== this._tok) return; await this._say(ws[i], AudioPlayer.PACE.dictation, voice, tok, i === 0); await sleep(420); }

    }
    _stopSources(){ for (const x of this._srcs){ try { x.stop(); } catch {} } this._srcs = []; }
    repeatAudio(pace){ if (!this._last) return Promise.reject(new AppError("tts", "اختر جملة أولاً.")); Trace.log("Processing", "AudioPlayer.repeatAudio()"); return this.playAudio(this._last, pace); }

  }

  /* ---- HEIC -> JPEG, loaded only when a browser cannot decode HEIC itself ---- */
  let heicLoading;

    }

  }

  /* ---- OCR for Arabic handwriting (Claude vision through the page's `sample` capability) ---- */
  class OCRProcessor {
    constructor(){ this.modelVersion = "Claude vision · default tier"; this.processingTimeLimit = 3000; }

      if (r.status === 503 || r.status === 429) throw new AppError("ocr_busy", "خدمة قراءة الخط مزدحمة الآن. أعد المحاولة بعد قليل، أو اكتب النص يدوياً.");
      if (!r.ok){ let d = ""; try { const j = await r.json(); d = " [" + r.status + ": " + (j.error || "") + " " + (j.detail || "") + "]"; } catch { d = " [" + r.status + "]"; } throw new AppError("ocr_failed", "تعذّر التعرّف على الخط." + d.slice(0, 260)); }

  };
  const TIMES = [W("صباحاً", "صَبَاحًا"), W("مساءً", "مَسَاءً"), W("اليوم", "الْيَوْمَ"), W("أمس", "أَمْسِ")];
  const PREP_IN = W("في", "فِي"), PREP_WITH = W("مع", "مَعَ");
  const pick = a => a[Math.floor(Math.random() * a.length)];
  class SentenceGenerator {
    build(level){
      const verb = pick(VERBS), subj = pick(SUBJ), obj = pick(verb.objs);
      const words = [subj.g === "m" ? verb.m : verb.f, W(subj.p, subj.v), W(obj.p, obj.v)];
      if (level >= 2){
        const place = PL[pick(verb.places)];
        if (level === 3){
          words.push(adj(pick(ADJSET[obj.a]), obj.g), PREP_IN, place);
          if (Math.random() < 0.5) words.push(pick(TIMES));
          else words.push(PREP_WITH, pick(COMP[subj.g].filter(c => c.id !== subj.id)));
        } else words.push(PREP_IN, place);
      }
      return {text: words.map(w => w.p).join(" "), spoken: words.map(w => w.v).join(" "), words: words.length};
    }
    generate(level, avoid = new Set()){
      Trace.log("Processing", "SentenceGenerator.generate(level " + level + ")");
      let s; for (let i = 0; i < 40; i++){ s = this.build(level); if (!avoid.has(s.text)) break; }
      return s;
    }
  }

  /* ---- Spelling comparison ---- */
  const TASHKEEL = /[ً-ٰٟـ]/g;
  const PUNCT = /[.,،؛;:!؟?"'«»()\[\]{}\-–—…]/g;
  const norm = s => s.replace(TASHKEEL, "").replace(PUNCT, " ").replace(/\s+/g, " ").trim();
  const words = s => { const n = norm(s); return n ? n.split(" ") : []; };
  function lev(a, b){
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let p = Array.from({length: n + 1}, (_, j) => j);
    for (let i = 1; i <= m; i++){ const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; }
    return p[n];
  }
  const GROUPS = [
    ["الهمزة", "أإآاءؤئ"], ["التاء المربوطة والهاء", "ةه"], ["التاء المفتوحة والمربوطة", "تة"], ["الألف المقصورة والياء", "ىي"],
    ["الظاء والضاد", "ظض"], ["الذال والزاي والدال", "ذزد"], ["الطاء والتاء", "طت"], ["السين والصاد والثاء", "سصث"], ["الكاف والقاف", "كق"]
  ];
  function classify(wrong, right){
    if (wrong.length === right.length){
      for (let i = 0; i < wrong.length; i++) if (wrong[i] !== right[i]){ const g = GROUPS.find(([, s]) => s.includes(wrong[i]) && s.includes(right[i])); return g ? g[0] : "حروف مختلفة"; }
    }
    if (wrong.length < right.length) return "حرف ناقص";
    if (wrong.length > right.length) return "حرف زائد";
    return "حروف مختلفة";
  }
  class ComparisonEngine {
    constructor(){ this.executionTimeLimit = 1500; }
    /* Compare Text -> Generate Evaluation -> Generate Feedback (all «include») */
    compareText(originalText, recognizedText){
      Trace.log("Processing", "ComparisonEngine.compareText()");
      const t0 = performance.now();
      const O = words(originalText), R = words(recognizedText);
      const rawR = recognizedText.replace(PUNCT, " ").replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
      const rawWords = rawR.length === R.length ? rawR : R;   /* keep the student's own diacritics when words line up */
      const n = O.length, m = R.length, D = Array.from({length: n + 1}, () => new Float64Array(m + 1));
      const sub = (i, j) => { if (O[i] === R[j]) return 0; const r = lev(O[i], R[j]) / Math.max(O[i].length, R[j].length); return r > 0.6 ? 2 : r * 1.2 + 0.1; };
      for (let i = 1; i <= n; i++) D[i][0] = i;
      for (let j = 1; j <= m; j++) D[0][j] = j;
      for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + sub(i - 1, j - 1));
      const ops = []; let i = n, j = m;
      while (i > 0 || j > 0){
        if (i > 0 && j > 0 && Math.abs(D[i][j] - (D[i - 1][j - 1] + sub(i - 1, j - 1))) < 1e-9){ ops.push(O[i - 1] === R[j - 1] ? {type: "ok", o: O[i - 1], r: rawWords[j - 1], ri: j - 1} : {type: "sub", o: O[i - 1], r: rawWords[j - 1], ri: j - 1}); i--; j--; }
        else if (i > 0 && Math.abs(D[i][j] - (D[i - 1][j] + 1)) < 1e-9){ ops.push({type: "miss", o: O[i - 1], r: null, ri: j}); i--; }
        else { ops.push({type: "extra", o: null, r: rawWords[j - 1], ri: j - 1}); j--; }
      }
      ops.reverse();
      const okCount = ops.filter(o => o.type === "ok").length;
      const score = O.length ? Math.round(okCount / Math.max(O.length, R.length) * 100) : 0;
      const details = ops.filter(o => o.type !== "ok").map(o => new CorrectionDetail({
        incorrectWord: o.r || "", correctWord: o.o || "", errorPositionIndex: o.ri, kind: o.type,
        hint: o.type === "sub" ? classify(norm(o.r), o.o) : o.type === "miss" ? "كلمة ناقصة" : "كلمة زائدة"
      }));
      const result = new EvaluationResult();
      result.generateResult({original: originalText, recognized: recognizedText, ops, score, details});
      result.meta.compareMs = Math.round((performance.now() - t0) * 10) / 10;
      return result;
    }
    identifySpellingMistakes(result){ return result.details.filter(d => d.kind === "sub"); }
  }
  return {AudioPlayer, OCRProcessor, ComparisonEngine, SentenceGenerator, heicToJpeg, norm, diacritize};
})();

const Application = (() => {
  const player = new Processing.AudioPlayer(), ocr = new Processing.OCRProcessor(), engine = new Processing.ComparisonEngine(), generator = new Processing.SentenceGenerator();
  player.voiceName = Data.Prefs.get("imla.voice", "");
  const AppController = {
    user: null, submission: null,
    /* validate inputs */
    validateSentenceText(t){
      t = (t || "").trim();
      if (t.length < 3) throw new AppError("sentence", "اكتب جملة من كلمتين على الأقل.");
      if (t.length > 200) throw new AppError("sentence", "الجملة طويلة. الحد الأقصى 200 حرف.");
      if (!/[؀-ۿ]/.test(t)) throw new AppError("sentence", "الجملة يجب أن تكون بالعربية.");
      if (/[A-Za-z]/.test(t)) throw new AppError("sentence", "أزل الحروف اللاتينية من الجملة.");
      if (t.split(/\s+/).length < 2) throw new AppError("sentence", "اكتب جملة من كلمتين على الأقل.");
      return t;
    },
    /* use cases: Login / Logout */
    async login({mode, name, email, password}){
      Trace.log("Application", "login()");
      email = (email || "").trim().toLowerCase();
      if (!/^\S+@\S+\.\S+$/.test(email)) throw new AppError("auth", "اكتب بريداً إلكترونياً صحيحاً.");
      if ((password || "").length < 6) throw new AppError("auth", "كلمة المرور 6 أحرف على الأقل.");
      let rec = Data.UserRepository.find(email);
      if (mode === "register"){
        if (rec) throw new AppError("auth", "هذا البريد مسجّل من قبل. سجّل الدخول.");
        if (!(name || "").trim()) throw new AppError("auth", "اكتب اسمك.");
        rec = await Data.UserRepository.create(name.trim(), email, password);
      } else {
        if (!rec || !(await Data.UserRepository.verify(rec, password))) throw new AppError("auth", "البريد أو كلمة المرور غير صحيحة.");
      }
      this.user = new User(rec); Data.UserRepository.session(rec.email); return this.user;
    },
    async guest(){ Trace.log("Application", "login(guest)"); let rec = Data.UserRepository.find("guest@imla.local") || await Data.UserRepository.create("ضيف", "guest@imla.local", "guest-demo"); this.user = new User(rec); Data.UserRepository.session(rec.email); return this.user; },
    restore(){ const e = Data.UserRepository.session(); const rec = e && Data.UserRepository.find(e); if (rec) this.user = new User(rec); return this.user; },
    logout(){ Trace.log("Application", "logout()"); player.stop(); this.dropSubmission(); this.user = null; Data.UserRepository.session(null); },
    /* use cases: Select Sentence / Enter Sentence */
    deleteSentence(id){ Trace.log("Application", "deleteSentence()"); const lvl = (this.sentence(id) || {}).level; const n = Data.SentenceRepository.remove(this._uid(), id); if (lvl) this._keepOne(lvl); return n; },
    _keepOne(level){},   /* a level may be left empty: the person asked for "delete all" to really delete all */
    clearLevel(level){ Trace.log("Application", "clearLevel()"); Data.SentenceRepository.clearLevel(this._uid(), level); this._keepOne(level); },
    voices(){ return player.voices(); },
    getVoice(){ return player.voiceName; },
    setVoice(name){ player.voiceName = name; Data.Prefs.set("imla.voice", name); },
    _uid(){ return this.user ? this.user.userID : "anon"; },
    sentences(){ return Data.SentenceRepository.all(this._uid()); },
    sentence(id){ return Data.SentenceRepository.get(this._uid(), id); },
    async enterSentence(text){ Trace.log("Application", "enterSentence()"); const t = this.validateSentenceText(text); const spoken = await Processing.diacritize(t); return Data.SentenceRepository.add(this._uid(), t, spoken); },
    /* unlimited sentences for a level (1 easy, 2 medium, 3 advanced) */
    generate(level){
      Trace.log("Application", "generate(level " + level + ") from recorded sentences");
      const uid = this._uid(), shown = Data.SentenceRepository.shown(uid), pool = Data.SEED.filter(x => x.level === level);
      const fresh = pool.filter(x => !shown.includes(x.sentenceId));
      const last = this._lastGen && this._lastGen[level];
      let pick;
      if (fresh.length){ pick = fresh[Math.floor(Math.random() * fresh.length)]; Data.SentenceRepository.show(uid, pick.sentenceId); }
      else { const o = pool.filter(x => x.sentenceId !== last); pick = o[Math.floor(Math.random() * o.length)]; }
      (this._lastGen = this._lastGen || {})[level] = pick.sentenceId; return Data.SentenceRepository.get(uid, pick.sentenceId);
    },
    /* use cases: Listen Sentence / Repeat Audio */
    listen(sentenceId, rate){ Trace.log("Application", "listen()"); const s = Data.SentenceRepository.get(this._uid(), sentenceId); if (!s) return Promise.reject(new AppError("sentence", "اختر جملة أولاً.")); return player.playAudio(s, rate); },
    repeat(pace){ Trace.log("Application", "repeat()"); return player.repeatAudio(pace); },
    stopAudio(){ player.stop(); },
    ttsSupported: () => Processing.AudioPlayer.supported() || !!player.clips,
    hasRecorded: () => !!player.clips,
    loadClips: () => player.loadClips(),
    canPlayRecorded: s => player.canPlayRecorded(s),
    /* use case: Upload Handwriting (validate + prepare) */
    async uploadHandwriting(file){
      Trace.log("Application", "uploadHandwriting()");
      this.dropSubmission(); const sub = new DictationSubmission();
      await sub.uploadImage(file); this.submission = sub; return sub;
    },
    dropSubmission(){ if (this.submission) this.submission.dispose(); this.submission = null; },
    ocrAvailable(){ return ocr.available(); },
    /* coordinate processing: OCR -> compare -> evaluation -> feedback -> save */
    async evaluateImage(sentenceId){
      Trace.log("Application", "evaluateImage()");
      const s = Data.SentenceRepository.get(this._uid(), sentenceId); if (!s) throw new AppError("sentence", "اختر جملة أولاً.");
      if (!this.submission) throw new AppError("image", "أضف صورة ورقتك أولاً.");
      const t0 = performance.now();
      const rec = await ocr.processImage(this.submission.blob);
      const ocrMs = Math.round(performance.now() - t0);
      return this._finish(s, rec.text, {source: "image", ocrMs, ocrLimit: ocr.processingTimeLimit, confidence: rec.confidence});
    },
    evaluateText(sentenceId, text, meta = {}){
      Trace.log("Application", "evaluateText()");
      const s = Data.SentenceRepository.get(this._uid(), sentenceId); if (!s) throw new AppError("sentence", "اختر جملة أولاً.");
      text = (text || "").trim(); if (!norm(text)) throw new AppError("text", "اكتب ما كتبته في الورقة أولاً.");
      if (text.length > 400) throw new AppError("text", "النص طويل جداً.");
      return this._finish(s, text, {source: meta.source || "typed", ...meta});
    },
    _finish(sentence, recognized, meta){
      const res = engine.compareText(sentence.textContent, recognized);
      Object.assign(res.meta, meta, {cmpLimit: engine.executionTimeLimit, sentenceId: sentence.sentenceId, ts: Date.now()});
      const view = res.displayResult();
      Data.ResultRepository.save(this.user.userID, {...view, details: res.details.map(d => ({...d, summary: d.getCorrectionSummary()})), id: res.resultId});
      return {view, res};
    },
    history(){ return this.user ? Data.ResultRepository.list(this.user.userID) : []; },
    clearHistory(){ if (this.user) Data.ResultRepository.clear(this.user.userID); }
  };
  const norm = Processing.norm;
  return {AppController, requirements: null};
})();

            <select id="voiceSel"><option value="">${App.hasRecorded() ? "تلقائي (الصوت المسجّل للموقع)" : S.voices.length ? "تلقائي (الأفضل المتاح: " + esc(S.voices[0].name) + ")" : "تلقائي"}</option>${S.voices.map(v => `<option value="${esc(v.name)}"${v.name === S.voice ? " selected" : ""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("")}</select></label>

          <div class="hidden-sentence ${S.reveal ? "" : "mask"}" aria-live="polite">${none ? "لا توجد جمل في هذا المستوى. اضغط «جملة جديدة تلقائياً» أو اكتب جملتك." : S.reveal ? esc(sel.textContent) : "النص مخفي"}</div>

          <div class="seg" role="group" aria-label="طريقة الإدخال"><button data-act="mode" data-v="image" aria-pressed="${S.mode === "image"}">صورة بخط اليد</button><button data-act="mode" data-v="text" aria-pressed="${S.mode === "text"}">كتابة النص</button></div>
          ${S.mode === "image" ? imagePane() : textPane()}

  }
  function imagePane(){

      ${S.busy === "ocr" ? `<div role="status" aria-live="polite"><div class="pbar fill"><i></i></div><div class="ptxt">جارٍ إرسال الصورة وقراءة الخط… لا تغلق الصفحة</div></div>` : ""}
      ${S.ocrOk === false ? `<div class="msg warn">خدمة قراءة الخط غير متاحة في هذا العرض. اكتب ما في ورقتك في تبويب «كتابة النص» لتحصل على التصحيح نفسه.</div>` : ""}

  function textPane(){
    return `<div style="margin-top:14px"><label class="f" for="typed">اكتب ما كتبته في الورقة، كما كتبته تماماً<textarea id="typed" dir="rtl" placeholder="اكتب هنا">${esc(S.typedText)}</textarea></label>
      <button class="btn primary" style="width:100%;margin-top:12px" data-act="evaltext">صحّح الإملاء</button></div>`;
  }

  /* ---------- result ---------- */
  function ring(score){
    const r = 45, C = 2 * Math.PI * r, col = score >= 80 ? "var(--ok)" : score >= 50 ? "var(--warn)" : "var(--bad)";
    return `<div class="ring" role="img" aria-label="الدقة ${score}%"><svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="${r}" stroke="var(--line)"/><circle cx="52" cy="52" r="${r}" stroke="${col}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - score / 100)}"/></svg><b>${score}%</b></div>`;
  }
  function resultPane(){
    const r = S.result;
    if (!r) return `<section class="card empty"><b>النتيجة تظهر هنا</b><span>استمع إلى جملة واكتبها ثم صوّرها، أو اكتب نصك مباشرة. ستظهر الكلمات الخاطئة مظللة بالأصفر مع صورتها الصحيحة.</span></section>`;
    const m = r.meta || {}, bad = r.details.length;
    const ocrCls = m.ocrMs == null ? "" : m.ocrMs <= m.ocrLimit ? "ok" : "warn";
    return `<section class="card" aria-labelledby="rh"><h2 id="rh">نتيجة التصحيح</h2>
      <div class="score">${ring(r.score)}<div style="flex:1;min-width:200px"><div class="fb" aria-live="polite">${esc(r.text)}</div></div></div>

      <div class="lbl">ما كتبته (الأخطاء مظللة)</div>
      <div class="sent" id="hl">${r.html || "—"}</div>

      <div class="lbl">الصيغة الصحيحة</div>
      <div class="sent" style="border-color:var(--ok)">${esc(r.corrected)}</div>

      <div class="lbl">الكلمات الخاطئة وصورتها الصحيحة</div>
      ${bad ? `<div class="tbl"><table><thead><tr><th>كتبتَ</th><th>الصحيح</th><th>نوع الخطأ</th><th>الموضع</th></tr></thead><tbody>${r.details.map(d => `<tr><td class="w">${d.kind === "miss" ? "—" : esc(d.incorrectWord)}</td><td class="w">${d.kind === "extra" ? "—" : esc(d.correctWord)}</td><td>${esc(d.hint)}</td><td>${d.errorPositionIndex + 1}</td></tr>`).join("")}</tbody></table></div>` : `<div class="msg ok">لا توجد أخطاء إملائية.</div>`}

      <div class="row" style="margin-top:16px">
        <button class="btn" data-act="repeat">${ICON.repeat}أعد نطق الجملة</button>
        <button class="btn primary" data-act="again">جملة جديدة</button>
      </div>

      <div class="metrics">
        <div class="metric">الدقة<b>${r.score}%</b></div>
        <div class="metric">أخطاء<b>${bad}</b></div>
        ${m.ocrMs != null ? `<div class="metric">قراءة الخط<b>${(m.ocrMs / 1000).toFixed(1)} ث</b><span class="chip ${ocrCls}">${ocrCls === "ok" ? "ضمن حد 3 ث" : "أبطأ من حد 3 ث"}</span></div>` : ""}
        <div class="metric">المقارنة والتقييم<b>${m.compareMs} مل ث</b><span class="chip ok">ضمن حد 1.5 ث</span></div>
        ${m.confidence != null ? `<div class="metric">ثقة القراءة<b>${m.confidence}%</b></div>` : ""}
      </div>

      ${m.source === "image" ? `<div class="lbl">هل قرأ النظام خطك بشكل صحيح؟ عدّل النص ثم أعد التقييم</div>
        <textarea id="editRec" dir="rtl" aria-label="النص الذي قرأه النظام">${esc(S.editText)}</textarea>
        <button class="btn sm" style="margin-top:8px" data-act="reeval">أعد التقييم</button>` : ""}
    </section>`;
  }

  /* ---------- history (View Feedback) ---------- */
  function history(){
    const h = App.history();
    const avg = h.length ? Math.round(h.reduce((a, x) => a + x.score, 0) / h.length) : 0;
    if (!h.length) return `<section class="card empty"><b>لا توجد نتائج بعد</b><span>بعد أول تصحيح تظهر نتائجك هنا لتتابع تقدمك.</span><button class="btn primary" data-act="tab" data-v="practice">ابدأ تمريناً</button></section>`;
    return `<div class="stack"><section class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">سجل نتائجك</h2><span class="muted">${h.length} محاولة · متوسط الدقة ${avg}%</span></div><button class="btn sm ghost" data-act="clearhist">مسح السجل</button></div></section>
      <div class="hist">${h.map((x, i) => `<article class="card hitem"><div class="n" style="color:${x.score >= 80 ? "var(--ok)" : x.score >= 50 ? "var(--warn)" : "var(--bad)"}">${x.score}%</div><div style="min-width:0"><div class="t">${esc(x.corrected)}</div><div class="muted">${new Date(x.meta.ts).toLocaleString("ar", {dateStyle: "medium", timeStyle: "short"})} · ${x.details.length} أخطاء</div></div><button class="btn sm" data-act="openhist" data-v="${i}">عرض</button></article>`).join("")}</div></div>`;
  }

  /* ---------- architecture + traceability ---------- */
  const FR = [
    ["Listen Sentence", "يُنطق الجملة العربية بوضوح", "AudioPlayer.playAudio() · Processing", "ok"],
    ["Select / Enter Sentence", "اختيار جملة أو إدخال جملة", "AppController.enterSentence() · Application", "ok"],
    ["Upload Handwriting", "التقاط صورة الإملاء أو رفعها", "DictationSubmission.captureImage()/uploadImage()", "ok"],
    ["Recognize Handwriting", "التعرّف على النص العربي في الصورة", "OCRProcessor.processImage() · Processing", "ok"],
    ["Compare Text", "مقارنة النص المقروء بالجملة الأصلية", "ComparisonEngine.compareText()", "ok"],
    ["Compare Text", "تحديد الأخطاء الإملائية", "ComparisonEngine.identifySpellingMistakes()", "ok"],
    ["Generate Evaluation", "عرض الكلمات الخاطئة وصورتها الصحيحة", "CorrectionDetail.getCorrectionSummary()", "ok"],
    ["Generate Feedback", "تظليل الأخطاء الإملائية", "Feedback.highlightSpellingMistakes()", "ok"],
    ["Generate Evaluation", "الصيغة الصحيحة للجملة", "EvaluationResult.correctedText", "ok"],
    ["Repeat Audio", "إعادة النطق عند الحاجة", "AudioPlayer.repeatAudio()", "ok"],
    ["Generate Feedback", "ملاحظات على أداء الإملاء", "Feedback.generateFeedback()", "ok"],
    ["View Feedback", "عرض النتيجة بشكل واضح", "EvaluationResult.displayResult() · Presentation", "ok"]
  ];
  const NFR = [
    ["قراءة الخط خلال 3 ثوانٍ", "يُقاس لكل محاولة ويظهر في بطاقة النتيجة. قدّمتُ الدقة على السرعة، فقد يتجاوز الحد أحياناً", "meas"],
    ["نطق بلا تأخير أو تشويه", "صوت المتصفح المحلي، مع مهلة 4 ثوانٍ ثم رسالة بديلة", "ok"],
    ["دقة التعرّف 90% على الخط الواضح", "لم تُقَس رسمياً. يمكنك تعديل النص المقروء وإعادة التقييم", "meas"],
    ["واجهة بسيطة على الجوال والحاسوب", "واجهة عربية متجاوبة (RTL)", "ok"],
    ["حماية الصور والسجلات", "الصور في الذاكرة فقط وتُحذف. كلمات المرور مُجزّأة. السجل محلي في المتصفح", "ok"],
    ["توفر 99.5%", "يتحدد بالاستضافة وليس بكود الصفحة", "host"],
    ["طلبات متزامنة دون تباطؤ", "كل العمليات غير متزامنة ولا تحجب الواجهة. الحمل الفعلي على الخدمة", "ok"],
    ["تظليل عالي التباين", "أصفر مع نص داكن وخط متموّج، فلا يعتمد على اللون وحده", "ok"],
    ["صيغ JPEG وPNG وHEIC", "DictationSubmission.validateFormat() مع تحويل HEIC عند الحاجة", "ok"],
    ["المقارنة خلال 1.5 ثانية", "يُقاس ويظهر (عادةً أقل من 10 مل ث)", "ok"],
    ["تخطيط متجاوب للنتيجة", "شبكة تتحول إلى عمود واحد على الجوال", "ok"],
    ["رسائل خطأ وبدائل", "فشل الصوت: إظهار النص. فشل القراءة: كتابة النص يدوياً", "ok"]
  ];
  const CHIP = {ok: ["مُنفَّذ", "ok"], meas: ["يُقاس ويُعرض", "warn"], host: ["يعتمد على الاستضافة", "warn"]};
  function arch(){
    const L = (k, desc, cls) => `<div class="layer" data-layer="${k}" style="--c:${LAYERS[k].c}"><h3><span>${LAYERS[k].ar}</span><span class="muted" style="font-size:12px;direction:ltr">${k}</span></h3><p>${desc}</p><div>${cls.map(c => `<span class="cls">${c}</span>`).join("")}</div></div>`;
    return `<div class="grid">
      <div class="stack">
        <section class="card"><h2>الطبقات الأربع</h2><div class="layers">
          ${L("Presentation", "واجهة الويب، تشغيل الصوت، رفع الصورة، عرض النتائج", ["UI render()", "events"])}<div class="arrow">⇅</div>
          ${L("Application", "التحقق من المدخلات، إدارة الطلبات، تنسيق المعالجة", ["AppController"])}<div class="arrow">⇅</div>
          ${L("Processing", "النطق العربي، قراءة الخط، مقارنة الإملاء، كشف الأخطاء، التقييم", ["AudioPlayer", "OCRProcessor", "ComparisonEngine", "Feedback"])}<div class="arrow">⇅</div>
          ${L("Data", "الجمل والنتائج والمستخدمون", ["SentenceRepository", "ResultRepository", "UserRepository"])}
        </div></section>
        <section class="card"><h2>تتبّع الطلبات مباشرةً</h2><p class="muted" style="margin-top:0">جرّب تمريناً ثم ارجع هنا لترى مسار كل طلب بين الطبقات.</p><div class="trace" id="trace" aria-live="off"></div></section>
      </div>
      <div class="stack">
        <section class="card"><h2>المتطلبات الوظيفية</h2><div class="tbl"><table><thead><tr><th>#</th><th>المتطلب</th><th>حالة الاستخدام</th><th>أين تحقق</th></tr></thead><tbody>${FR.map((r, i) => `<tr><td>${i + 1}</td><td>${r[1]}</td><td><span class="cls">${r[0]}</span></td><td><span class="cls">${r[2]}</span></td></tr>`).join("")}</tbody></table></div></section>
        <section class="card"><h2>المتطلبات غير الوظيفية</h2><div class="tbl"><table><thead><tr><th>#</th><th>المتطلب</th><th>كيف تحقق</th><th>الحالة</th></tr></thead><tbody>${NFR.map((r, i) => `<tr><td>${i + 1}</td><td>${r[0]}</td><td>${r[1]}</td><td><span class="chip ${CHIP[r[2]][1]}">${CHIP[r[2]][0]}</span></td></tr>`).join("")}</tbody></table></div></section>
      </div></div>`;
  }
  function paintTrace(hot){
    const el = document.getElementById("trace"); if (!el) return;
    el.innerHTML = Trace.items.length ? Trace.items.slice(0, 30).map(t => `<div><i style="color:${LAYERS[t.layer].c}">${t.layer}</i><span>${esc(t.msg)}</span></div>`).join("") : '<div class="muted" style="font-family:var(--font-ui);direction:rtl">لا توجد طلبات بعد.</div>';
    if (hot){ const l = document.querySelector(`.layer[data-layer="${hot}"]`); if (l){ l.classList.add("hot"); setTimeout(() => l.classList.remove("hot"), 500); } }
  }
  function hookTrace(){ paintTrace(); }
  Trace.listeners.push(h => { if (S.tab === "arch") paintTrace(h); });

  /* ---------- actions ---------- */
  const errText = e => (e && e.message) || "حدث خطأ غير متوقع. أعد المحاولة.";
  const noSentence = () => !S.selectedId || !App.sentence(S.selectedId);
  async function listen(repeat){
    setMsg("audio"); if (S.playing){ App.stopAudio(); }
    if (noSentence()){ S.playing = false; setMsg("audio", "warn", "لا توجد جملة مختارة. اضغط «جملة جديدة تلقائياً» أو اختر جملة من القائمة أو اكتب جملتك أولاً."); render(); return; }
    S.playing = true; render();
    try { await (repeat ? App.repeat(S.rate) : App.listen(S.selectedId, S.rate)); }
    catch (e) { setMsg("audio", "warn", errText(e) + (e.code === "tts" ? " يمكنك قراءة الجملة بدلاً من سماعها." : "")); if (e.code === "tts") S.reveal = true; }
    S.playing = false; render();
  }
  async function takeFile(file){
    if (!file) return; setMsg("upload"); S.result = null; S.prep = true; render();
    try {
      const sub = await App.uploadHandwriting(file);
      const bmp = await createImageBitmap(sub.blob);
      S.preview = {url: sub.imagePath, format: sub.imageFormat, w: bmp.width, h: bmp.height};
      setMsg("upload", "ok", "الصورة جاهزة.");
    } catch (e) { S.preview = null; setMsg("upload", "bad", errText(e)); }
    S.prep = false; render();
  }
  async function evalImage(){
    setMsg("upload"); if (noSentence()){ setMsg("upload", "warn", "لا توجد جملة مختارة. اضغط «جملة جديدة تلقائياً» أو اختر جملة من القائمة أو اكتب جملتك أولاً."); render(); return; }
    S.busy = "ocr"; render();
    try {
      const {view} = await App.evaluateImage(S.selectedId);
      S.result = view; S.editText = view.recognized; setMsg("upload");
    } catch (e) {
      setMsg("upload", e.code === "ocr_illegible" ? "warn" : "bad", errText(e));
      if (e.code === "ocr_unavailable") S.ocrOk = false;
      if (e.code && e.code.startsWith("ocr")) S.typedText = S.typedText || "";
    }
    S.busy = ""; render();
    if (S.result) document.getElementById("resultCol")?.scrollIntoView({behavior: "smooth", block: "start"});
  }
  function evalTyped(text, meta){
    if (noSentence()){ setMsg("upload", "warn", "لا توجد جملة مختارة. اضغط «جملة جديدة تلقائياً» أو اختر جملة من القائمة أو اكتب جملتك أولاً."); return; }
    try { const {view} = App.evaluateText(S.selectedId, text, meta); S.result = view; S.editText = view.recognized; setMsg("upload"); }
    catch (e) { setMsg("upload", "bad", errText(e)); }
    render();
    if (S.result) document.getElementById("resultCol")?.scrollIntoView({behavior: "smooth", block: "start"});
  }

  $app.addEventListener("click", async ev => {
    const b = ev.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act, v = b.dataset.v;
    if (a !== "del" && a !== "delall") S.delId = "";
    if (a === "tab"){ S.tab = v; render(); }
    else if (a === "authmode"){ S.authMode = v; setMsg("auth"); render(); }
    else if (a === "guest"){ await App.guest(); S.ocrOk = null; render(); probeOcr(); }
    else if (a === "logout"){ App.logout(); Object.assign(S, {result: null, preview: null, tab: "practice", selectedId: "e1", level: 1, reveal: false, playing: false, busy: "", draftSentence: "", typedText: "", editText: "", mode: "image", msg: {}}); render(); }
    else if (a === "pick"){ S.selectedId = v; S.reveal = false; S.result = null; setMsg("audio"); setMsg("sentence"); render(); }
    else if (a === "level"){ S.level = Number(v); S.selectedId = ""; S.reveal = false; S.result = null; setMsg("audio"); setMsg("sentence"); render(); }
    else if (a === "gen"){ App.stopAudio(); S.playing = false; S.selectedId = App.generate(S.level).sentenceId; S.reveal = false; S.result = null; setMsg("audio"); setMsg("sentence"); render(); }
    else if (a === "del"){
      if (S.delId !== v){ S.delId = v; render(); }
      else { S.delId = ""; App.deleteSentence(v); if (S.selectedId === v){ S.selectedId = ""; S.reveal = false; S.result = null; App.stopAudio(); S.playing = false; } render(); }
    }
    else if (a === "delall"){
      if (S.delId !== "all"){ S.delId = "all"; render(); }
      else { S.delId = ""; App.clearLevel(S.level); S.selectedId = ""; S.reveal = false; S.result = null; App.stopAudio(); S.playing = false; render(); }
    }
    else if (a === "listen") listen(false);
    else if (a === "repeat") listen(true);
    else if (a === "stop"){ App.stopAudio(); S.playing = false; render(); }
    else if (a === "rate"){ S.rate = v; render(); }
    else if (a === "reveal"){ S.reveal = !S.reveal; render(); }
    else if (a === "mode"){ S.mode = v; setMsg("upload"); render(); }
    else if (a === "rmimg"){ App.dropSubmission(); S.preview = null; setMsg("upload"); render(); }
    else if (a === "evalimg") evalImage();
    else if (a === "evaltext"){ S.typedText = document.getElementById("typed")?.value ?? S.typedText; evalTyped(S.typedText, {source: "typed"}); }
    else if (a === "reeval"){ const t = document.getElementById("editRec")?.value || ""; const m = S.result?.meta || {}; evalTyped(t, {source: "image", ocrMs: m.ocrMs, ocrLimit: m.ocrLimit, confidence: m.confidence}); }
    else if (a === "again"){ S.selectedId = App.generate(S.level).sentenceId; S.result = null; S.reveal = false; App.dropSubmission(); S.preview = null; S.typedText = ""; setMsg("upload"); setMsg("audio"); render(); window.scrollTo({top: 0, behavior: "smooth"}); }
    else if (a === "openhist"){ const x = App.history()[Number(v)]; if (x){ S.result = {...x, details: x.details}; S.editText = x.recognized; S.selectedId = x.meta.sentenceId || S.selectedId; S.level = (App.sentence(S.selectedId) || {level: S.level}).level; S.tab = "practice"; render(); } }
    else if (a === "clearhist"){ App.clearHistory(); render(); }
  });
  $app.addEventListener("submit", async ev => {
    ev.preventDefault();
    if (ev.target.id === "authForm"){
      const g = id => document.getElementById(id)?.value || "";
      try { await App.login({mode: S.authMode, name: g("au-name"), email: g("au-email"), password: g("au-pw")}); setMsg("auth"); S.ocrOk = null; render(); probeOcr(); }
      catch (e) { setMsg("auth", "bad", errText(e)); render(); }
    } else if (ev.target.id === "addForm"){
      const el = document.getElementById("newSentence");
      try { const btn = el.form.querySelector("button"); btn.disabled = true; btn.textContent = "جارٍ التشكيل…"; const s = await App.enterSentence(el.value); S.selectedId = s.sentenceId; S.level = s.level; S.draftSentence = ""; S.reveal = false; S.result = null; setMsg("sentence", "ok", s.spokenText !== s.textContent ? "أُضيفت الجملة وشُكّلت لتُنطق بشكل صحيح. اضغط زر التشغيل." : "أُضيفت الجملة. تعذّر تشكيلها تلقائياً، فقد يخطئ الصوت في حركات أواخر الكلمات."); }
      catch (e) { S.draftSentence = el.value; setMsg("sentence", "bad", errText(e)); }
      render();
    }
  });
  $app.addEventListener("input", ev => { if (ev.target.id === "typed") S.typedText = ev.target.value; if (ev.target.id === "newSentence") S.draftSentence = ev.target.value; if (ev.target.id === "editRec") S.editText = ev.target.value; });
  $app.addEventListener("change", ev => { if (ev.target.id === "voiceSel"){ S.voice = ev.target.value; App.setVoice(S.voice); return; } if (ev.target.id === "camIn" || ev.target.id === "fileIn"){ const f = ev.target.files[0]; ev.target.value = ""; takeFile(f); } });
  $app.addEventListener("dragover", ev => { if (ev.target.closest("#drop")){ ev.preventDefault(); if (!S.dragOver){ S.dragOver = true; document.getElementById("drop").classList.add("over"); } } });
  $app.addEventListener("dragleave", ev => { if (ev.target.closest("#drop")){ S.dragOver = false; document.getElementById("drop")?.classList.remove("over"); } });
  $app.addEventListener("drop", ev => { if (ev.target.closest("#drop")){ ev.preventDefault(); S.dragOver = false; takeFile(ev.dataTransfer.files[0]); } });

  async function loadVoices(){
    if (!App.ttsSupported()) return;
    S.voices = await App.voices(); S.voicesLoaded = true;
    if (App.user && S.tab === "practice" && (!document.activeElement || document.activeElement === document.body)) render();
  }
  if ("speechSynthesis" in window) speechSynthesis.addEventListener("voiceschanged", loadVoices);
  async function probeOcr(){ loadVoices(); S.clipsLoading = true; App.loadClips().finally(() => { S.clipsLoading = false; }).then(() => { if (App.user && S.tab === "practice" && (!document.activeElement || document.activeElement === document.body)) render(); }); S.ocrOk = await App.ocrAvailable(); S.tts = App.ttsSupported(); if (S.ocrOk === false && S.mode === "image" && !App.submission) { render(); } }

  /* exposed only for the test harness */
  window.__imla = {App, S, render};
  App.restore(); render(); if (App.user) probeOcr();
})();
</script>
</body></html>
